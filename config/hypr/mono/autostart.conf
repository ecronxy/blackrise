# mono: автозапуск настоящей сессии (во вложенном тестовом окне не подключается)
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# окно выбора файлов как в GNOME (systemd-юнит портала работает только в GNOME-сессии)
exec-once = /usr/libexec/xdg-desktop-portal-gnome
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = hyprpaper -c ~/.config/hypr/mono/hyprpaper.conf
# док и буфер обмена (вместо waybar)
exec-once = ~/.local/bin/mono-dock
# фоновые экземпляры без окон: терминал и файлы открываются сразу
exec-once = ghostty --gtk-single-instance=true --initial-window=false
exec-once = nautilus --gapplication-service
# буфер обмена: порт Clipboard Indicator из GNOME
exec-once = ~/.local/bin/mono-clipboard
exec-once = ~/.local/bin/mono-minimize
# центр управления и уведомления
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = swayidle -w timeout 600 ~/.local/bin/mono-lock timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep ~/.local/bin/mono-lock

exec-once = ~/.local/bin/mono-quick   # быстрые настройки как в GNOME
exec-once = ~/.local/bin/mono-screenshot   # панель снимка экрана как в GNOME
exec-once = ~/.local/bin/mono-automount   # флешки монтируются сами, как в GNOME
