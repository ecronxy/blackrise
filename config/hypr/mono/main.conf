# mono: чёрно-белый Hyprland. Чёрный основной, белый акцент, скругления,
# зазоры между окнами, лёгкая прозрачность с размытием.

# ---------------------------------------------------------------- мониторы
# по умолчанию: любой монитор в родном разрешении. Свои мониторы пропиши здесь, например:
#   monitor = HDMI-A-1, 1920x1080@165, 0x0, 1
# основной монитор для дока, центра управления и экрана блокировки (имя из `hyprctl monitors`):
#   env = MONO_MAIN_OUTPUT,HDMI-A-1
monitor = , preferred, auto, 1

source = ~/.config/hypr/mono/input.conf

# ---------------------------------------------------------------- окружение
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
# GTK_THEME не задаём: он навязывает libadwaita-программам чужую тему поверх ~/.config/gtk-4.0/gtk.css
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ---------------------------------------------------------------- вид
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(ffffffee)
    col.inactive_border = rgba(ffffffff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 28
    rounding_power = 2.0
    active_opacity = 0.93
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    # тени выключены, размытие лёгкое (1 проход): Athlon 3000G + Vega 3
    shadow {
        enabled = false
        range = 18
        render_power = 3
        color = rgba(000000aa)
    }

    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
        noise = 0.02
        brightness = 1.0
        vibrancy = 0
        popups = true
    }
}

animations {
    enabled = true
    bezier = out, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, out, slide
    animation = windowsOut, 1, 3, out, popin 85%
    animation = border, 1, 6, out
    animation = fade, 1, 4, out
    animation = layers, 1, 3, out, fade
    animation = workspaces, 1, 4, out, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(000000)
    vfr = true
    # если экран блокировки упадёт, его можно перезапустить, а не получить красный экран
    allow_session_lock_restore = true
}

# ---------------------------------------------------------------- правила
# видео и картинки без прозрачности; Ghostty прозрачен сам (фон, а не текст)
windowrule = opaque, class:^(mpv|vlc|org.gnome.Loupe|steam|com.mitchellh.ghostty)$
windowrule = float, class:^(nm-connection-editor|org.pulseaudio.pavucontrol)$
windowrule = float, title:^(Open File|Select a File|Open Folder|Save As|File Upload|Library)(.*)$
windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrule = noblur, class:^(xwaylandvideobridge)$

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorealpha 0.3, notifications
layerrule = noanim, selection

# ---------------------------------------------------------------- клавиши
$mod = SUPER
$terminal = ~/.local/bin/mono-term
$browser = google-chrome-stable
$files = nautilus --new-window
$menu = wofi --show drun -c ~/.config/wofi/mono/config -s ~/.config/wofi/mono/style.css
$lock = ~/.local/bin/mono-lock

bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, Space, exec, $menu
bind = $mod, R, exec, $menu
bind = $mod, L, exec, $lock
bind = $mod, I, exec, ~/.local/bin/mono-settings
# нажать и отпустить Super: обзор окон (в сочетаниях Super+клавиша не срабатывает)
bindr = SUPER, code:133, exec, ~/.local/bin/mono-dock-overview   # по коду клавиши: имя Super_L не ловится в русской раскладке
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, F, fullscreen,
bind = $mod, V, exec, ~/.local/bin/mono-clipboard toggle
# буфер как в GNOME (Clipboard Indicator) был на Super+Shift+V
bind = $mod SHIFT, V, exec, ~/.local/bin/mono-clipboard toggle
bind = $mod SHIFT, F, togglefloating,
bind = $mod, M, exec, ~/.local/bin/mono-minimize toggle
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,


# снимок и запись экрана: панель как в GNOME (mono-screenshot); во время записи то же сочетание её останавливает
bind = $mod SHIFT, S, exec, ~/.local/bin/mono-screenshot toggle
bind = CTRL SHIFT, S, exec, ~/.local/bin/mono-screenshot toggle
bind = , Print, exec, ~/.local/bin/mono-screenshot toggle

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/mono-vol up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/mono-vol down
bindl = , XF86AudioMute, exec, ~/.local/bin/mono-vol mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-

# панель быстрых настроек (сеть, звук, выключение)
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, logout_dialog
layerrule = blur, mono-panel
layerrule = blur, mono-overview
layerrule = ignorezero, mono-overview
layerrule = ignorezero, mono-panel
bind = $mod, X, exec, ~/.local/bin/mono-quick toggle
bind = $mod, Escape, exec, wlogout -b 5 -T 400 -B 400

# картинка из буфера по Ctrl+V в терминале (Claude Code), см. mono-paste-image
bindn = CTRL, V, exec, ~/.local/bin/mono-paste-image
layerrule = blur, mono-quick
layerrule = ignorezero, mono-quick
layerrule = noanim, mono-screenshot
